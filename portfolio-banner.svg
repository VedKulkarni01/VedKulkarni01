<svg width="900" height="150" viewBox="0 0 900 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E1420"/>
      <stop offset="100%" stop-color="#161D2E"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4FD1C5"/>
      <stop offset="50%" stop-color="#E8A23D"/>
      <stop offset="100%" stop-color="#9B7EDE"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4FD1C5"/>
      <stop offset="100%" stop-color="#9B7EDE"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4FD1C5" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4FD1C5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- outer border -->
  <rect x="0" y="0" width="900" height="150" rx="16" fill="url(#borderGrad)"/>
  <!-- inner panel -->
  <rect x="2" y="2" width="896" height="146" rx="14" fill="url(#bg)"/>

  <!-- ambient glow -->
  <circle cx="150" cy="75" r="140" fill="url(#glow)"/>
  <circle cx="750" cy="75" r="140" fill="url(#glow)"/>

  <!-- background network motif (subtle) -->
  <g stroke="#2A3552" stroke-width="1" opacity="0.6">
    <line x1="60" y1="40" x2="120" y2="65"/>
    <line x1="120" y1="65" x2="90" y2="110"/>
    <line x1="120" y1="65" x2="175" y2="45"/>
    <line x1="780" y1="35" x2="830" y2="60"/>
    <line x1="830" y1="60" x2="800" y2="110"/>
    <line x1="830" y1="60" x2="860" y2="90"/>
  </g>
  <g fill="#4FD1C5" opacity="0.55">
    <circle cx="60" cy="40" r="3"/>
    <circle cx="120" cy="65" r="4.5"/>
    <circle cx="90" cy="110" r="3"/>
    <circle cx="175" cy="45" r="3"/>
  </g>
  <g fill="#E8A23D" opacity="0.55">
    <circle cx="780" cy="35" r="3"/>
    <circle cx="830" cy="60" r="4.5"/>
    <circle cx="800" cy="110" r="3"/>
    <circle cx="860" cy="90" r="3"/>
  </g>

  <!-- main content -->
  <text x="450" y="65" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="3" fill="#8B95AC">EXPLORE THE FULL PICTURE</text>

  <text x="450" y="103" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="32" fill="url(#textGrad)">View My Portfolio →</text>

  <text x="450" y="130" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1" fill="#8B95AC">vedkulkarni01.github.io &#183; Bioinformatics &#183; Machine Learning &#183; Network Science</text>
</svg>
